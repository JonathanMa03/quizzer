[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quizzer"
version = "0.1.0"
description = "Agentic quiz generation for course materials"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pypdf>=4.2.0",
  "python-dotenv>=1.0.1",
  "beautifulsoup4>=4.12.3",
  "markdown>=3.6",
  "openai>=1.0.0",
  "matplotlib>=3.8.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
notebook = ["ipykernel>=6.29"]

[project.scripts]
gen_quizzes = "quizzer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
